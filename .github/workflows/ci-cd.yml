name: Docker Build Test

on:
  push:
    branches:
      - dev2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Get build number
        run: echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }} 
        
      - name: Build Docker Image
        run: | 
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/myapp:${{ env.BUILD_NUMBER }} .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/myapp:${{ env.BUILD_NUMBER }} \
                     ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/myapp:${{ env.BUILD_NUMBER }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest
