name: Docker Build and Deploy Two Servers

on:
  push:
    branches:
      - dev2

jobs:

  # =========================
  # BUILD JOB
  # =========================
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Create build number
      - name: Get build number
        run: echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV

      # Docker Hub Login
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/myapp:${{ env.BUILD_NUMBER }} .

          docker tag \
          ${{ secrets.DOCKERHUB_USERNAME }}/myapp:${{ env.BUILD_NUMBER }} \
          ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest

      # Push Docker Image
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/myapp:${{ env.BUILD_NUMBER }}

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest

  # =========================
  # DEPLOY JOB
  # =========================
  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:

      # =========================
      # DEPLOY SERVER 1
      # =========================
      - name: Deploy to Server 1
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest

            docker stop myapp-container || true

            docker rm myapp-container || true

            docker run -d \
              --name myapp-container \
              --restart always \
              -p 8000:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest

            docker image prune -f

      # =========================
      # DEPLOY SERVER 2
      # =========================
      - name: Deploy to Server 2
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST_1 }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest

            docker stop myapp-container || true

            docker rm myapp-container || true

            docker run -d \
              --name myapp-container \
              --restart always \
              -p 8000:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest

            docker image prune -f